name: pages

# The website is a Hugo site (hugo.toml, sources in site/). It is rebuilt on
# every push to main, so the sitemap, canonical URLs and structured data always
# match what is in the repository.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.155.2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: sitemap lastmod comes from git
      - name: Install Hugo
        run: |
          curl -fsSL -o hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb && rm hugo.deb
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build site
        env:
          HUGO_ENVIRONMENT: production
          TZ: UTC
        run: make site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
