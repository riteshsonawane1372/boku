<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boku</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23ffe600'/%3E%3Ctext x='16' y='24' text-anchor='middle' font-family='Helvetica,Arial,sans-serif' font-size='24' font-weight='800' fill='%230a0a0a'%3EB%3C/text%3E%3C/svg%3E">
<script>
  // Apply the saved theme before first paint.
  try { var t = localStorage.getItem("boku-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <a class="brand" href="#/new" aria-label="Boku">
      <span>Boku</span>
    </a>
    <nav class="side-nav" id="nav" aria-label="Main"></nav>
    <div class="side-foot">
      <a class="sys" id="sys" href="#/settings" title="System check"></a>
      <div class="side-meta">
        <span id="version"></span>
        <button class="icon-btn" id="theme" type="button" aria-label="Toggle colour theme"></button>
      </div>
    </div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>
<div id="toasts" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
