- q: "What is Boku?"
  a: "Boku is an open-source, multi-agent research engine written in Go. You give it a question; a planner, parallel researchers, an independent fact-checker, a synthesizer and an editor produce a cited research report as PDF, HTML or Markdown, or a PowerPoint deck."
- q: "How does Boku keep AI research reports accurate?"
  a: "Researchers return structured findings that each keep their sources. An independent fact-checking agent rejects unsupported claims and orders follow-up research. The editor can cite only findings that survived, citations are resolved by code, and a chart or headline number is drawn only if every value appears in the cited evidence. Anything that could not be verified is printed in a red “Not verified” notice."
- q: "Can Boku generate PowerPoint presentations?"
  a: "Yes. Run boku slides \"your topic\", or add --format pptx to any report. Boku writes a 16:9 .pptx with one point per slide, charts and diagrams as native editable shapes, tables, and speaker notes that carry the full cited text. It opens in PowerPoint, Keynote and Google Slides."
- q: "What does the expert do when I use --refine?"
  a: "Before any research starts, a scoping expert reads your topic, asks three to five questions specific to that subject, and rewrites the request into a precise brief with what is in scope, out of scope and assumed. You confirm, edit or reject it; only then does the run begin."
- q: "How much does a report cost?"
  a: "Measured full reports cost between about $8 and $31 in Claude Code usage, depending on depth. A short report is roughly $4 to $6. Quick mode runs every agent on a local Ollama model and spends no API money."
- q: "Which models does Boku work with?"
  a: "Claude Code by default. With a config file it runs on any OpenAI-compatible endpoint, such as vLLM, LM Studio, llama.cpp or OpenRouter, or on a local Ollama model, using Boku's own web search."
- q: "Is Boku free and open source?"
  a: "Yes. Boku is released under the Apache-2.0 licence. You pay only for the model usage of the provider you choose."
- q: "Where can I see example reports, decks and whitepapers?"
  a: "The examples section of this site links real, unedited output: two research reports as PDF, the same two runs as PowerPoint decks, and a report set in the whitepaper layout. They are also in the repository under docs/examples."
